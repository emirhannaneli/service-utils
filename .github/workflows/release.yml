name: Release

# Every push to main keeps a "release PR" up to date. It collects the conventional commits since
# the last release, derives the next semantic version from them (fix -> patch, feat -> minor,
# `!` / BREAKING CHANGE -> major) and updates CHANGELOG.md and the version in build.gradle.kts.
# Merging that PR tags the release and publishes the package.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish package
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # Only used to decide whether the optional second registry is configured.
      REPO_USER: ${{ secrets.REPO_USER }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build and run tests
        run: ./gradlew build --no-daemon

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishGprPublicationToGitHubPackagesRepository --no-daemon

      - name: Publish to repo.emirman.dev
        # Optional second registry: skipped until REPO_USER / REPO_KEY are configured as secrets.
        if: env.REPO_USER != ''
        env:
          REPO_KEY: ${{ secrets.REPO_KEY }}
        run: ./gradlew publishGprPublicationToEmirmanRepository --no-daemon
